<style>
/* Layout: player card header (jersey #15) with season + team pickers, sticky tab bar, one column of match cards / stat panels; badger stripe as the only motif */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#16181a; --muted:#5d6560; --line:#dde0da;
  --badger:#1d2023; --stripe:#ffffff;
  --flag:#e9b200; --flag-ink:#3a2c00; --flag-soft:#fff4cc;
  --win:#1f7a44; --win-soft:#dff1e6; --loss:#b3362c; --loss-soft:#f7e1de; --tie:#6b6f73; --tie-soft:#e7e8e9;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121416; --surface:#1b1e21; --ink:#eceeea; --muted:#9aa29c; --line:#2c3034;
  --badger:#0b0c0d; --stripe:#e8e9e6;

:root[data-theme="dark"]{

  --flag:#f2c230; --flag-ink:#2a2000; --flag-soft:#3a3010;
  --win:#5cc98a; --win-soft:#173524; --loss:#ef7d72; --loss-soft:#3b1d1a; --tie:#a5a9ad; --tie-soft:#2a2d30;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
button{font-family:var(--body)}
button:focus-visible,a:focus-visible{outline:3px solid var(--flag);outline-offset:2px}

/* Header / player card */
.hero{background:var(--badger);color:#f4f4f2;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0 auto 0 50%;width:34px;transform:translateX(150px) skewX(-14deg);background:var(--stripe);opacity:.92}
.hero::before{content:"";position:absolute;inset:0 auto 0 50%;width:12px;transform:translateX(205px) skewX(-14deg);background:var(--flag)}
.hero .wrap{position:relative;z-index:1;padding-block:28px 24px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.jersey{font-family:var(--display);font-weight:900;font-size:96px;line-height:.8;color:var(--flag);letter-spacing:-.02em}
.who{min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#b9bdb8}
.who h1{font-size:44px;font-weight:800;line-height:.95;margin-top:4px;text-transform:uppercase}
.who p{margin:8px 0 0;color:#d6d8d4;font-size:15px}
.pickers{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9da29d;align-self:center;margin-right:2px}
.seg button{font-weight:600;font-size:14px;border:1.5px solid #5a5f63;background:transparent;color:#f4f4f2;border-radius:999px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--flag);border-color:var(--flag);color:var(--flag-ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}

/* Key numbers */
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:-1px}
.keys div{background:var(--surface);padding:14px 12px}
.keys b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.keys b small{font-size:18px;color:var(--muted)}
.keys span{font-size:13px;color:var(--muted)}
.keys .hl b{color:var(--flag)}
@media (max-width:520px){.keys{grid-template-columns:repeat(2,1fr)}.jersey{font-size:72px}.who h1{font-size:34px}.hero::after,.hero::before{display:none}}

/* Tabs */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs a{font:700 15px var(--body);text-decoration:none;color:var(--muted);padding:14px 12px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--flag)}
main{padding-block:20px 48px}
section{display:grid;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:28px;font-weight:800;text-transform:uppercase}
.sec-h small{color:var(--muted);font-size:13px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Match cards */
.day{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:12px 14px;text-decoration:none}
.match:hover{border-color:var(--muted)}
.res{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:24px}
.res.S{background:var(--win-soft);color:var(--win)} .res.N{background:var(--loss-soft);color:var(--loss)} .res.U{background:var(--tie-soft);color:var(--tie)}
.res.F{background:var(--bg);color:var(--muted);border:1.5px dashed var(--line);font-size:13px;font-family:var(--body);font-weight:700;text-align:center;line-height:1.1}
.mid{min-width:0}
.opp{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.venue{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.venue b{color:var(--ink);font-weight:600}
.venue::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--flag);margin-right:6px;vertical-align:1px}
.score{font-family:var(--display);font-weight:800;font-size:28px;text-align:right;line-height:1}
.score small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag.sami{background:var(--flag);color:var(--flag-ink);border-color:var(--flag)}
.tag.absent{border-style:dashed}
.match.star{border-color:var(--flag);box-shadow:inset 4px 0 0 var(--flag)}
.match.future .score{font-size:22px;color:var(--muted)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:20px;font-weight:800;text-transform:uppercase;margin-bottom:10px}
.note{font-size:14px;color:var(--muted);margin:0}
.callout{background:var(--flag-soft);border:1px solid var(--flag);border-radius:12px;padding:14px 16px}
.callout p{margin:0}
.callout b{font-family:var(--display);font-size:22px;text-transform:uppercase;display:block;margin-bottom:2px}

/* Season cards (overview) */
.seasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;text-align:left;cursor:pointer;color:var(--ink)}
.scard:hover{border-color:var(--muted)}
.scard .t{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}
.scard .s{font-size:13px;color:var(--muted)}
.scard .row{display:flex;gap:16px;flex-wrap:wrap}
.scard .row div{display:grid}
.scard .row b{font-family:var(--display);font-size:28px;line-height:1}
.scard .row span{font-size:12px;color:var(--muted)}
.scard .row .hl b{color:var(--flag)}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}
tr.me td,tr.us td{background:var(--flag-soft);font-weight:700}
td.name{white-space:normal;min-width:150px}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:500 11px var(--body)}
.chart .axis{stroke:var(--line)}
.chart .pos{fill:var(--win)} .chart .neg{fill:var(--loss)} .chart .zero{fill:var(--tie)}
.chart .sami{fill:var(--flag)}

.strip{display:grid;gap:4px}
.strip i{height:28px;border-radius:5px;background:var(--line);display:block}
.strip i.p{background:var(--ink)}
.strip i.td{background:var(--flag)}
.strip-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.strip-legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

footer{font-size:13px;color:var(--muted);padding-block:0 40px}
@media (prefers-reduced-motion:no-preference){.match,.scard{transition:border-color .15s}}
</style>
</head>

function totals(team){
  const t = {};
  for (const g of team.games){
    for (const n of g.p) (t[n] ??= {gp:0,v:[0,0,0,0,0]}).gp++;
    for (const [n,v] of Object.entries(g.s)) v.forEach((x,i)=>(t[n] ??= {gp:0,v:[0,0,0,0,0]}).v[i]+=x);
  }
  return t;
}

function matchCard(g){
  const r = result(g), played = g.p.includes(ME), mine = g.s[ME];
  const tags = [];

  else if (mine){ STAT.forEach((s,i)=>{ if (mine[i]) tags.push(`<span class="tag sami">Sami: ${mine[i]} ${s}</span>`); }); }
  else tags.push(`<span class="tag">Sami gespielt</span>`);
  if (g.nostats) tags.push(`<span class="tag">keine Einzelstatistik erfasst</span>`);
  const rl = {S:"Sieg",N:"Niederlage",U:"Unentschieden"}[r];
  return `<a class="match${mine?" star":""}" href="https://www.clubee.com/afbo/games/${g.id}" target="_blank" rel="noopener">

}

  let last = null;

  return `<section>${html}</section>`;

function chart(games){
  const n = games.length, w = 720, h = 230, pad = {l:30,r:8,t:16,b:30};
  const max = 50, iw = w-pad.l-pad.r, ih = h-pad.t-pad.b, mid = pad.t+ih/2, bw = iw/n;
  const y = v => mid - (Math.max(-max,Math.min(max,v))/max)*(ih/2);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Punktedifferenz pro Spiel">`;
  for (const v of [-50,-25,0,25,50]) s += `<line class="axis" x1="${pad.l}" x2="${w-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke-width="${v?0.6:1.2}"/><text x="${pad.l-6}" y="${y(v)+4}" text-anchor="end">${v>0?"+":""}${v}</text>`;
  games.forEach((g,i)=>{
    const diff = g.us-g.them, bwi = Math.min(bw*0.64,40), x = pad.l+i*bw+(bw-bwi)/2;
    const cls = diff>0?"pos":diff<0?"neg":"zero";
    const top = diff>=0?y(diff):mid, hh = Math.max(2,Math.abs(y(diff)-mid));
    s += `<rect class="${cls}" x="${x}" y="${top}" width="${bwi}" height="${hh}" rx="2"><title>${fmtDate(g.d)} ${g.opp}: ${g.us}:${g.them}</title></rect>`;
    if (g.s[ME]) s += `<circle class="sami" cx="${x+bwi/2}" cy="${diff>=0?top-8:top+hh+8}" r="5"/>`;
    if (i===0 || games[i-1].sp!==g.sp) s += `<text x="${x}" y="${h-10}">ST ${g.sp}</text>`;
  });
  return s + `</svg>`;
}

  return `<section>
   <div class="sec-h"><h2>Samis Saison</h2><small>${T.league} · ${DATA[season].label}</small></div>
   ${best?`<div class="callout"><b>Bestes Spiel</b><p>${fmtDate(best.g.d)}, ${best.g.home?"gegen":"bei"} ${best.g.opp} (${best.g.us}:${best.g.them}): ${STAT.map((s,i)=>best.g.s[ME][i]?best.g.s[ME][i]+" "+STATLONG[s]:"").filter(Boolean).join(", ")}.</p></div>`:""}
   <div class="panel"><h3>Dabei in ${me.gp} von ${T.games.length} Spielen</h3>
     <div class="strip" style="grid-template-columns:repeat(${T.games.length},1fr)" aria-label="Spiele der Saison in Reihenfolge">${strip}</div>
     <div class="strip-legend" style="margin-top:10px"><span style="--c:var(--ink)">gespielt</span><span style="--c:var(--flag)">mit Touchdown</span><span style="--c:var(--line)">nicht dabei</span></div>
     <p class="note" style="margin-top:8px">${missed.length?`Nicht dabei: ${missed.map(g=>`${fmtDate(g.d)} ${g.home?"gegen":"bei"} ${g.opp}`).join("; ")}.`:"Sami war bei jedem Spiel dabei."}</p></div>
   <div class="panel"><h3>Samis Werte</h3><div class="tablewrap"><table>
     <thead><tr><th class="l">Kategorie</th><th>Sami</th><th>Team gesamt</th></tr></thead><tbody>
     <tr><td class="l">Spiele</td><td>${me.gp}</td><td>${T.games.length}</td></tr>
     ${STAT.map((s,i)=>`<tr><td class="l">${STATLONG[s]}</td><td>${me.v[i]}</td><td>${sum(Object.values(tt),t=>t.v[i])}</td></tr>`).join("")}
     </tbody></table></div>
     <p class="legend">Team gesamt zählt nur, was in den Aufstellungen eingetragen ist.${nostats?` Bei ${nostats} Spielen fehlen die Einzelstatistiken ganz.`:""} Die Summe kann daher unter den tatsächlich erzielten Punkten liegen.</p></div>
   <div class="panel chart"><h3>Punktedifferenz pro Spiel</h3>${chart(T.games)}
     <p class="legend">Grün: Sieg, Rot: Niederlage, gelber Punkt: Spiel mit Statistik-Eintrag von Sami. Badgers ${team}: ${sum(T.games,g=>g.us)} Punkte erzielt, ${sum(T.games,g=>g.them)} kassiert.</p></div>
  </section>`;
}

function tableHTML(tb){
  const empty = tb.rows.every(r=>r[1]+r[2]+r[3]===0);
  return `<div class="panel"><h3>${tb.name}</h3><div class="tablewrap"><table>
   <thead><tr><th class="l">#</th><th class="l">Team</th>${empty?"":`<th>S</th><th>N</th><th>U</th><th>Punkte</th><th>Diff</th>`}</tr></thead><tbody>
   ${tb.rows.map((r,i)=>`<tr class="${r[0].startsWith("Münchendorf")?"us":""}"><td class="l">${empty?"–":(i+1)+"."}</td><td class="l name">${r[0]}</td>${empty?"":`<td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}:${r[5]}</td><td>${r[4]-r[5]>0?"+":""}${r[4]-r[5]}</td>`}</tr>`).join("")}
   </tbody></table></div>${empty?`<p class="legend">Diese Runde hat noch nicht begonnen.</p>`:""}</div>`;
}
function viewTabelle(){
  const T = cur();
  return `<section><div class="sec-h"><h2>Tabelle ${team} · ${season}</h2><small>${T.league}</small></div>
   ${T.tables.map(tableHTML).join("")}
   <p class="note">S = Siege, N = Niederlagen, U = Unentschieden. ${T.tableNote}</p></section>`;
}

function viewTeam(){
  const T = cur(), tt = totals(T);
  const rows = Object.entries(tt).sort((a,b)=>b[1].v[0]-a[1].v[0] || b[1].v[1]-a[1].v[1] || b[1].gp-a[1].gp);
  return `<section><div class="sec-h"><h2>Badgers ${team} · ${season}</h2><small>Kader laut Aufstellungen</small></div>
   <div class="panel"><div class="tablewrap"><table>
   <thead><tr><th class="l">Spieler/in</th><th>Sp</th><th>TD</th><th>XP</th><th>INT</th><th>Sack</th></tr></thead><tbody>
   ${rows.map(([n,t])=>`<tr class="${n===ME?"me":""}"><td class="l name">${NAMES[n]}</td><td>${t.gp}</td><td>${t.v[0]}</td><td>${t.v[1]}</td><td>${t.v[3]}</td><td>${t.v[4]}</td></tr>`).join("")}
   </tbody></table></div>
   <p class="legend">Sp = Spiele, TD = Touchdowns, XP = Extrapunkte, INT = Interceptions. Trainer laut Aufstellung: ${T.coach}.</p></div></section>`;
}

const VIEWS = {ueberblick:viewUeberblick, spiele:viewSpiele, statistik:viewStatistik, tabelle:viewTabelle, team:viewTeam};
function render(){
  const tab = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "ueberblick";
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.tab===tab?"page":"false"));
  document.querySelectorAll("[data-season]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.season===season));
  document.querySelectorAll("[data-team]").forEach(b=>{ b.setAttribute("aria-pressed", b.dataset.team===team); b.disabled = !DATA[season][b.dataset.team]; b.title = b.disabled ? "In dieser Saison hatten die Badgers kein U15-Team" : ""; });
  const T = cur();
  $("#subline").textContent = `${T.league} · ${DATA[season].label}`;
  renderKeys();
  $("#main").innerHTML = VIEWS[tab]();
}
function save(){ try{ localStorage.setItem("sami-sel", JSON.stringify({season,team})); }catch(e){} }
document.addEventListener("click", e=>{
  const s = e.target.closest("[data-season]");
  if (s){ season = s.dataset.season; if (!DATA[season][team]) team = "U13"; filter="alle"; save(); render(); return; }
  const t = e.target.closest("[data-team]");
  if (t && !t.disabled){ team = t.dataset.team; filter="alle"; save(); render(); return; }
  const go = e.target.closest("[data-go]");
  if (go){ [season,team] = go.dataset.go.split("|"); filter="alle"; save(); location.hash = "spiele"; render(); window.scrollTo(0,0); return; }
  const f = e.target.closest(".chips button");
  if (f){ filter = f.dataset.f; render(); }
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
